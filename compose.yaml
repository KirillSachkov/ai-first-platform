name: ai-first-platform

# Local development stack. `docker compose up --wait` returns once every long-running service is healthy;
# `docker compose watch` additionally syncs source changes into api and web.
# Infrastructure only, for running the apps on the host: `pnpm infra:up`.

x-database-url: &database-url postgres://${POSTGRES_APP_USER:?set in .env}:${POSTGRES_APP_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
x-rabbitmq-url: &rabbitmq-url amqp://${RABBITMQ_DEFAULT_USER:?set in .env}:${RABBITMQ_DEFAULT_PASS:?set in .env}@rabbitmq:5672

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?set in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/create-app-role.sh:/docker-entrypoint-initdb.d/create-app-role.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

  # One-shot: applies every module's migrations as the owning role, then exits.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    command: ["pnpm", "--filter", "@platform/api", "db:migrate"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    environment:
      DATABASE_URL: *database-url
      RABBITMQ_URL: *rabbitmq-url
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3100}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The image has no curl; Node's fetch checks readiness instead.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    init: true
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /workspace/apps/api/src
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      API_PROXY_TARGET: http://api:3000
      WEB_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Healthy only when the page is served and the /api proxy reaches a ready backend.
      test:
        - CMD
        - node
        - -e
        - "Promise.all(['/', '/api/health/ready'].map((p) => fetch('http://127.0.0.1:5173' + p))).then((rs) => process.exit(rs.every((r) => r.ok) ? 0 : 1), () => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    init: true
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /workspace/apps/web/src
        - action: sync
          path: ./apps/web/index.html
          target: /workspace/apps/web/index.html
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./pnpm-lock.yaml

volumes:
  postgres-data:
  rabbitmq-data:
