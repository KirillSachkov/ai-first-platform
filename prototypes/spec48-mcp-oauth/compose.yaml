# PROTOTYPE, throwaway. Start with: docker compose -p proto-spec48-mcp up -d
name: proto-spec48-mcp
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      # Test-only bootstrap admin for the local Keycloak console and admin API.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:18480:8080"
    volumes:
      - ./keycloak/spec48-realm.json:/opt/keycloak/data/import/spec48-realm.json:ro
    mem_limit: 1g
