name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Fail the harness job on purpose to test the failure report.
        type: boolean
        default: false

# Read-only by default; only report-main-failure gets write access to issues.
permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its previous run; every main run has its own group.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Full level everywhere except pull requests.
  FULL: ${{ github.event_name != 'pull_request' }}

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KirillSachkov/agent-kit
          ref: 94c236f63240a78e209b14012ff2143f22cfbda8
          path: .agent-kit-ci
          persist-credentials: false
      - name: Check project harness
        run: |
          python3 .agent-kit-ci/tools/skills.py check --project .
          test -s BRIEF.md
      - name: Exercise the failure report
        if: inputs.simulate_failure
        run: exit 1

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan the pull request commits
        if: env.FULL != 'true'
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --redact --no-banner --log-opts="$RANGE" .
      - name: Scan the whole history
        if: env.FULL == 'true'
        run: ./gitleaks git --redact --no-banner .

  ci-ok:
    needs: [harness, gitleaks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "$HARNESS" = success && test "$GITLEAKS" = success
        env:
          HARNESS: ${{ needs.harness.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}

  report-main-failure:
    needs: [harness, gitleaks]
    if: failure() && (github.ref == 'refs/heads/main' || inputs.simulate_failure)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "CI: проверки в main упали"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Прогон: $RUN_URL (коммит ${GITHUB_SHA::7}, ref $GITHUB_REF_NAME)."
          issue=$(gh issue list --label bug --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Снова упали. $body"
          else
            gh issue create --label bug --title "$TITLE" \
              --body "Проверки CI в main упали. Почините main до новых изменений. $body"
          fi
