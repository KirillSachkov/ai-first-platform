packages:
  - apps/*
  - packages/*
engineStrict: true
saveExact: true
strictPeerDependencies: true
# Fresh releases wait a day before install, which limits exposure to compromised versions.
minimumReleaseAge: 1440
allowBuilds:
  # Telemetry postinstall of @nestjs/swagger; not needed.
  "@scarf/scarf": false
  esbuild: true
peerDependencyRules:
  allowedVersions:
    # openapi-typescript 7 declares typescript ^5 but runs on the TypeScript 6 API unchanged.
    "openapi-typescript>typescript": "6"
    # Steiger reads tsconfig through tsconfck, which declares typescript ^5 and works with 6.
    "tsconfck>typescript": "6"
